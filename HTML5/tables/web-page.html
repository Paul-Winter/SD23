<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Table</title>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th colspan="3">header</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="left">left</td>
                    <th id="main">main</th>
                    <td id="right">right</td>
                </tr>    
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3">footer</th>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
