<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Второй проект</title>
        <!--<link rel="stylesheet" href="styles.css" />-->
        <style>
            body{
                position: relative;
                height: 2000px;
            }
            div {
                background: navy;
                width: 255px;
                height: 255px;
                position: absolute;
            }
        </style>  
        <script src="script.js"></script>
    </head>
    <body onclick="colorDIV(event)">
        <div id="DIV"></div>
        <script>
            DIV.addEventListener("mousemove", function(e){
                DIV.style.backgroundColor = "rgb(127," +
                    e.pageX + "," +
                    e.pageY + ")";
            })
        </script>
        <p id="PAR"></p>
    </body>
</html>
