<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Телефонная книга</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js"></script>
    </head>
    <body>
        <h2>Добавить новый контакт</h2>
        <form id="addForm" method="get">
            <b>Name</b>
            <input type="text" placeholder="Введите имя:"/>
            <br/><br/>
            <input type="submit" value="Сохранить"/>
            <input type="button"
                   value="Добавить номер телефона"
                   style="margin-left: 70px"
                   onclick="addClick()"/>
            <br/><br/>
            Телефон:<input type="text" placeholder="Введите номер телефона"/>
            тип:
            <select name="type">
                <option value="1" selected>Мобильный</option>
                <option value="2">Домашний</option>
                <option value="3">Рабочий</option>
            </select>
            По умолчанию:
            <input type="radio" name="priority" value="1" checked/>
        </form>
        <button onclick="showElements()">Elements</button>
        <p id="out"></p>
    </body>
</html>
