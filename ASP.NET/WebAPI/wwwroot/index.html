<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Пользовательская админка</title>
    <style>        
        button { margin: 5px; }
    </style>
</head>
<body>
    <h2>ПОЛЬЗОВАТЕЛИ:</h2>
    <div>
        <input type="hidden" id="userId"/>
        <p>
            Login:<br/>
            <input id="userLogin"/>
        </p>
        <p>
            Password:<br/>
            <input id="userPass"/>
        </p>
        <p>
            <button id="saveBtn">СОХРАНИТЬ</button>
            <button id="clearBtn">СБРОС</button>
        </p>
    </div>
    <table>
        <thead><tr><th>Login</th><th>Password</th></tr></thead>
        <tbody></tbody>
    </table>
    <script>
        async function getUsers() {
            const response = await fetch("/api/users", {
                method: "GET",
                headers: { "Accept": "application/json" }
            });
            if (response.ok === true) {
                const users = await response.json();
                const rows = document.querySelector("tbody");
                users.forEach(user => rows.append(row(user)));
            }
        }
        async function getUser(id) {
            const response = await fetch(`/api/users/${id}`, {
                method: "GET",
                headers: { "Accept": "application/json" }
            });
            if (response.ok === true) {
                const user = await response.json();
                document.getElementById("userId").value = user.Id;
                document.getElementById("userLogin").value = user.Login;
                document.getElementById("userPass").value = user.Password;
            }
            else {
                const error = await response.json();
                console.log(error.message);
            }
        }
        async function addUser(userLog, userPass) {
            const response = await fetch("/api/users", {
                method: "POST",
                headers: { "Accept": "application/json", "Content-Type": "appliction/json" },
                body: JSON.stringify({
                    login: userLog,
                    password: userPass
                })
            });
            if (response.ok === true) {
                const user = await response.json();
                document.querySelector("tbody").append(row(user));
            }
            else {
                const error = await response.json();
                console.log(error.message);
            }
        }
        async function editUser(userId, userLog, userPass) {
            const response = await fetch("/api/users", {
                method: "PUT",
                headers: { "Accept": "application/json", "Content-Type": "application/json" },
                body: JSON.stringify({
                    id: userId,
                    login: userLog,
                    password: userPass
                })
            });
            if (response.ok === true) {
                const user = await response.json();
                document.querySelector(`tr[data-rowid='${user.Id}']`).replaceWith(row(user));
            }
            else {
                const error = await response.json();
                console.log(error.message);
            }
        }
        async function dropUser(id) {
            const response = await fetch(`/api/users/${id}`, {
                method: "DELETE",
                headers: { "Accept": "application/json" }
            });
            if (response.ok === true) {
                const user = await response.json();
                document.querySelector(`tr[data-rowid='${user.Id}']`).remove();
            }
            else {
                const error = await response.json();
                console.log(error.message);
            }
        }
        function row(user) {
            const tr = document.createElement("tr");
            tr.setAttribute("data-rowid", user.Id);

            const tdLogin = document.createElement("td");
            tdLogin.append(user.Login);
            tr.append(tdLogin);
            const tdPass = document.createElement("td");
            tdPass.append(user.Password);
            tr.append(tdPass);

            const tdButtons = document.createElement("td");
            const editButton = document.createElement("button");
            editButton.append("ИЗМЕНИТЬ");
            editButton.addEventListener("click", async () => await getUser(user.Id));
            tdButtons.append(editButton);

            const dropButton = document.createElement("button");
            dropButton.append("УДАЛИТЬ");
            dropButton.addEventListener("click", async () => await dropUser(user.Id));
            tdButtons.append(dropButton);
            tr.appendChild(tdButtons);

            return tr;
        }
        function clear() {
            document.getElementById("userId").value = "";
            document.getElementById("userLogin").value = "";
            document.getElementById("userPass").value = "";
        }
        document.getElementById("clearBtn").addEventListener("click", () => clear());

        document.getElementById("saveBtn").addEventListener("click", async () => {
            const id = document.getElementById("userId").value;
            const login = document.getElementById("userLogin").value;
            const password = document.getElementById("userPass").value;

            if (id === "") {
                await addUser(login, password);
            }
            else {
                await editUser(id, login, password);
                clear();
            }
        });

        getUsers();
    </script>
</body>
</html>
